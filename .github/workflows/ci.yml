name: BITE prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  rust-protocol-tests:
    name: Rust protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run protocol tests
        run: cargo test --locked --workspace
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
  state-machine-tests:
    name: State-machine tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  bitcoin-regtest-smoke:
    name: Bitcoin Core regtest smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start isolated regtest node and mine test blocks
        run: bash scripts/regtest-smoke.sh
      - name: Remove disposable regtest container and data
        if: always()
        run: docker compose --project-name bite-stage2-regtest --file contrib/regtest/compose.yaml down --volumes
