name: BITE prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  rust-protocol-tests:
    name: Rust protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: TEMPORARY - regenerate Cargo lockfile
        run: cargo generate-lockfile
      - name: TEMPORARY - export generated Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bite-stage2-generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run protocol tests
        run: cargo test --locked --workspace
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
  state-machine-tests:
    name: State-machine tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
