name: BITE prototype checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:

  rust-protocol-tests:
    name: Rust protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: TEMP - regenerate Cargo.lock for the observer crate
        run: cargo generate-lockfile
      - name: TEMP - commit Cargo.lock to the feature branch
        if: github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git add Cargo.lock
          git commit -m "Lock Bitcoin observer dependencies"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run protocol tests
        run: cargo test --locked --workspace
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
  state-machine-tests:
    name: State-machine tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  bitcoin-regtest-smoke:
    name: Bitcoin Core regtest observer integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BITE_REGTEST_DATA_DIR: ${{ runner.temp }}/bite-regtest-data
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start isolated regtest node and mine test blocks
        run: bash scripts/regtest-smoke.sh
      - name: Remove disposable regtest container and data
        if: always()
        run: |
          docker compose --project-name bite-stage2-regtest --file contrib/regtest/compose.yaml down --volumes
          rm -rf "$BITE_REGTEST_DATA_DIR"
