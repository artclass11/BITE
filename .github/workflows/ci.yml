name: BITE prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  state-machine-tests:
    name: State-machine tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
