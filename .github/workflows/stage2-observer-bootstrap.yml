name: Temporary Stage 2 observer dependency verification

on:
  push:
    branches:
      - feat/rust-protocol-core

permissions:
  contents: write

jobs:
  observer-build:
    name: Resolve, compile and lint observer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit lockfile and rustfmt output
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/bite-bitcoin-observer/src/lib.rs crates/bite-bitcoin-observer/tests/regtest_rpc.rs
          if git diff --cached --quiet; then
            echo "Cargo.lock and Rust files are already current."
            exit 0
          fi
          git commit -m "Lock observer dependencies and format Rust sources"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Check formatting after commit
        run: cargo fmt --all -- --check
      - name: Run all Rust workspace tests
        run: cargo test --locked --workspace
      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Export generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bite-observer-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
