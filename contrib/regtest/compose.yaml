services:
  bitcoind:
    image: bitcoin/bitcoin:32.1
    init: true
    command:
      - -printtoconsole
      - -regtest=1
      - -server=1
      - -listen=0
      - -connect=0
      - -dnsseed=0
      - -discover=0
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.16.0.0/12
      - -rpcport=18443
    volumes:
      - ${BITE_REGTEST_DATA_DIR:?Set BITE_REGTEST_DATA_DIR to a private host directory}:/home/bitcoin/.bitcoin
    ports:
      - "127.0.0.1:18443:18443"
    networks:
      - regtest-isolated
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

networks:
  regtest-isolated:
    internal: true
