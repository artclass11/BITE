[package]
name = "bite-bitcoin-observer"
version = "0.1.0"
edition = "2021"
description = "Read-only Bitcoin Core regtest observer for BITE"
license = "MIT"

[dependencies]
corepc-client = "=0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
