[package]
name = "bite-protocol"
version = "0.1.0"
edition = "2021"
description = "Offline, non-custodial BTC/USD order protocol primitives for BITE"
license = "MIT"

[dependencies]
nostr = "=0.45.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
nostr = { version = "=0.45.7", features = ["os-rng"] }
